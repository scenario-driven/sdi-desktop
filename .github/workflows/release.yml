name: Release

# Tag push (v*) builds the desktop bundles and publishes a draft GitHub
# Release. workflow_dispatch runs the same matrix as a build-only dry run
# (no release is created) so the build can be verified green before a
# permanent tag is cut.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: 'sdi-plugin git ref to source the dashboard SPA from'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.platform }} ${{ matrix.args }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    steps:
      # Sibling layout under a "scenario-driven" parent so that this repo's
      # tauri.conf.json `frontendDist = ../sdi-plugin/plugin/web/dist` and
      # `beforeBuildCommand = pnpm --dir ../sdi-plugin/plugin/web build`
      # resolve exactly as they do in local development.
      - name: Checkout sdi-desktop
        uses: actions/checkout@v4
        with:
          path: scenario-driven/sdi-desktop

      - name: Checkout sdi-plugin (dashboard SPA source)
        uses: actions/checkout@v4
        with:
          repository: scenario-driven/sdi-plugin
          ref: ${{ github.event.inputs.plugin_ref || 'main' }}
          path: scenario-driven/sdi-plugin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scenario-driven/sdi-plugin/plugin/web/pnpm-lock.yaml

      # Build the SPA from a controlled working directory so its `dist/` lands
      # exactly where tauri.conf.json's frontendDist (resolved relative to the
      # config dir) points: <workspace>/scenario-driven/sdi-plugin/plugin/web/dist.
      # tauri.conf.json's beforeBuildCommand uses a relative `../sdi-plugin`
      # that only holds in the local wrapper layout — it's overridden to null
      # for the CI build below, so this step is the SPA's only build here.
      - name: Build dashboard SPA
        working-directory: scenario-driven/sdi-plugin/plugin/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scenario-driven/sdi-desktop

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Stage the sdid daemon as the Tauri externalBin sidecar. tauri.conf.json
      # declares `bundle.externalBin: ["bin/sdid"]`, so the bundler needs a
      # per-target `bin/sdid-<triple>` to copy next to the app binary (where
      # src/daemon.rs resolves it as `<exe_dir>/sdid`). Built from the sibling
      # sdi-plugin checkout so the shipped daemon matches this build.
      - name: Stage sdid sidecar (externalBin)
        shell: bash
        working-directory: scenario-driven/sdi-plugin
        run: |
          set -euo pipefail
          TRIPLE="$(echo '${{ matrix.args }}' | sed -n 's/.*--target \([^ ]*\).*/\1/p')"
          [ -z "$TRIPLE" ] && TRIPLE="$(rustc -vV | sed -n 's/host: //p')"
          rustup target add "$TRIPLE" || true
          cargo build -p sdi-daemon --release --target "$TRIPLE"
          EXT=""; case "$TRIPLE" in *windows*) EXT=".exe";; esac
          DEST="../sdi-desktop/bin"
          mkdir -p "$DEST"
          cp "target/$TRIPLE/release/sdid$EXT" "$DEST/sdid-$TRIPLE$EXT"
          echo "staged $DEST/sdid-$TRIPLE$EXT"

      # Compiles + bundles the desktop binary. The SPA is already built (step
      # above), so beforeBuildCommand is overridden to null via --config —
      # tauri.conf.json keeps it for local dev, but its relative `../sdi-plugin`
      # path does not resolve under CI's checkout layout. frontendDist still
      # resolves relative to the config dir and finds the dist built above.
      # When tagName is empty (workflow_dispatch) it only builds, uploads nothing.
      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization. These secrets are only
          # consumed on the macos-latest runners; on Linux/Windows tauri-action
          # ignores them. Set them once in the repo (Settings → Secrets):
          #   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
          #   APPLE_CERTIFICATE_PASSWORD   the .p12 export password
          #   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: NAME (TEAMID)"
          #   APPLE_ID / APPLE_PASSWORD    Apple ID + an app-specific password (notarytool)
          #   APPLE_TEAM_ID                the 10-char Team ID
          # The same Developer ID Application cert used for other apps is reused;
          # SDI does not need its own certificate — only its own bundle id
          # (org.sdi.desktop) and these account-level credentials.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: scenario-driven/sdi-desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'SDI Desktop __VERSION__'
          releaseBody: 'macOS bundles are Developer ID signed + notarized (open normally). Linux/Windows bundles are unsigned.'
          releaseDraft: false
          prerelease: true
          args: "${{ matrix.args }} --config '{\"build\":{\"beforeBuildCommand\":\"\"}}'"
